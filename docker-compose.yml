services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./outputs:/app/outputs"]
  ui:
    build: .
    command: streamlit run src/ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment: ["API_URL=http://api:8000"]
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [api]
